[build-system]
# hatch-jupyter-builder builds the labextension; its build hook is wired in Task 2
# (there is no labextension yet, so enabling it now would break `pip install -e .`).
requires = ["hatchling>=1.21", "hatch-jupyter-builder>=0.9"]
build-backend = "hatchling.build"

[project]
name = "localpilot-jupyter"
version = "0.1.0"
description = "LocalPilot for JupyterLab: local Ollama-backed completions and agent chat"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Framework :: Jupyter :: JupyterLab :: 4",
  "Framework :: Jupyter :: JupyterLab :: Extensions",
  "Programming Language :: Python :: 3",
]
dependencies = ["jupyter_server>=2.13,<3", "tornado>=6.1"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-jupyter[server]>=0.6", "pytest-asyncio>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["localpilot_jupyter"]
# The bundled core (localpilot_jupyter/bin/<triple>/localpilot-core) is git-ignored
# but must ship in the wheel.
artifacts = ["localpilot_jupyter/bin"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/jupyter_server_config.d" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.targets.sdist]
artifacts = ["localpilot_jupyter/bin"]
exclude = [".venv", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Async tests run on pytest-jupyter's loop (the one the Jupyter server lives on);
# pytest-asyncio stays in strict mode so it never claims them as well.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
