[build-system]
# hatch-jupyter-builder builds the labextension (jlpm build:prod) into
# localpilot_jupyter/labextension when a wheel is built; see the jupyter-builder hook below.
# jupyterlab provides jlpm and `jupyter labextension build` in isolated build envs.
requires = ["hatchling>=1.21", "hatch-jupyter-builder>=0.9", "jupyterlab>=4.5,<5"]
build-backend = "hatchling.build"

[project]
name = "localpilot-jupyter"
version = "0.1.1"
description = "LocalPilot for JupyterLab: local Ollama-backed completions and agent chat"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Framework :: Jupyter :: JupyterLab :: 4",
  "Framework :: Jupyter :: JupyterLab :: Extensions",
  "Programming Language :: Python :: 3",
]
dependencies = ["jupyter_server>=2.13,<3", "tornado>=6.1"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-jupyter[server]>=0.6", "pytest-asyncio>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["localpilot_jupyter"]
# The bundled core (localpilot_jupyter/bin/<triple>/localpilot-core) is git-ignored
# but must ship in the wheel. The built labextension ships only as shared-data
# (share/jupyter/labextensions/...), not a second time inside the package.
artifacts = ["localpilot_jupyter/bin"]
exclude = ["localpilot_jupyter/labextension"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/jupyter_server_config.d" = "etc/jupyter/jupyter_server_config.d"
"localpilot_jupyter/labextension" = "share/jupyter/labextensions/localpilot-jupyter"
"install.json" = "share/jupyter/labextensions/localpilot-jupyter/install.json"

# The prebuilt labextension (git-ignored) is produced by `jlpm build:prod`
# (`jlpm build` for editable installs) before the wheel is assembled.
[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.9"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
  "localpilot_jupyter/labextension/static/style.js",
  "localpilot_jupyter/labextension/package.json",
]
skip-if-exists = ["localpilot_jupyter/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "localpilot_jupyter/labextension"

[tool.hatch.build.targets.sdist]
artifacts = ["localpilot_jupyter/bin", "localpilot_jupyter/labextension"]
exclude = [".venv", ".github", "node_modules", "lib", ".yarn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Async tests run on pytest-jupyter's loop (the one the Jupyter server lives on);
# pytest-asyncio stays in strict mode so it never claims them as well.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
