pluginGroup = dev.localpilot
pluginVersion = 0.1.0

# PyCharm Professional 2026.2.3 = build PY-262.10968.92 (the installed IDE).
platformType = PY
platformVersion = 2026.2.3
pluginSinceBuild = 262

# The platform bundles the Kotlin stdlib (and kotlinx.serialization); do not ship our own.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache = true
org.gradle.caching = true
# Run Gradle itself on JDK 17 (machine-specific; override in ~/.gradle/gradle.properties or JAVA_HOME elsewhere).
org.gradle.java.home = /opt/homebrew/Cellar/openjdk@17/17.0.20.1/libexec/openjdk.jdk/Contents/Home
