[package]
name = "localpilot-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "LocalPilot sidecar: JSON-RPC over stdio between IDE clients and a local Ollama"
publish = false

[lib]
name = "localpilot_core"
path = "src/lib.rs"

[[bin]]
name = "localpilot-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
globset = "0.4"
ignore = "0.4"
lru = "0.12"
notify = "6"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
